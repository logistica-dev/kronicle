# ./docker-compose.yml

services:
  # --------------------------
  # TimescaleDB / PostgreSQL
  # --------------------------
  db:
    image: timescale/timescaledb:latest-pg17 # Use latest TimescaleDB image (PostgreSQL 16)
    # image: timescaledev/timescaledb:2.26.0-pg17 # Dev version
    container_name: kronicle-db
    environment:
      # Set from env file or .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KRONICLE_DB_NAME: ${KRONICLE_DB_NAME}
    volumes:
      - ./kronicle-db-data:/var/lib/postgresql/data # Persist DB data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "5432:5432" # optional, local access
    networks:
      - kronicle-net # Shared network for app <> db communication
    restart: unless-stopped # Automatically restart unless stopped manually

  # --------------------------
  # Kronicle App container
  # --------------------------
  app:
    image: ghcr.io/logistica-dev/kronicle:latest
    container_name: kronicle-app
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      - db
    environment:
      KRONICLE_DB_HOST: db # <- directly reference the db service
      KRONICLE_DB_PORT: 5432 # fixed port inside network
      POSTGRES_DB: ${POSTGRES_DB}
      KRONICLE_DB_NAME: ${KRONICLE_DB_NAME}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KRONICLE_CHAN_CREDS: ${KRONICLE_CHAN_CREDS}
      KRONICLE_RBAC_CREDS: ${KRONICLE_RBAC_CREDS}

      KRONICLE_PORT: ${KRONICLE_PORT:-8000}
      KRONICLE_HOST: 0.0.0.0

      KRONICLE_SU_INFO: ${KRONICLE_SU_INFO}

      KRONICLE_CONF: /opt/kronicle/conf/default-conf.ini
      KRONICLE_ENV: test
      KRONICLE_LOG_LEVEL: 3

      # Migration backup location: directory + file name prefix.
      # KRONICLE_BACKUP_DIR is the mount target below; KRONICLE_BACKUP_PREFIX
      # is just the file name prefix (defaults to "kronicle").
      KRONICLE_BACKUP_DIR: ${KRONICLE_BACKUP_DIR:-/opt/kronicle/backup}
    volumes:
      # Persist migration backup dumps outside the container, on the host.
      # Target must match KRONICLE_BACKUP_DIR; host source is relative to
      # this compose file (change it for e.g. ~/kronicle-dev/backup).
      - ${KRONICLE_BACKUP_HOST_DIR:-./backup}:${KRONICLE_BACKUP_DIR:-/opt/kronicle/backup}
    ports:
      - "8000:${KRONICLE_PORT:-8000}"
    networks:
      - kronicle-net # Same network as db
    restart:
      "unless-stopped" # "no" or "unless-stopped"
      # Keep container running unless manually stopped

# ------------------------------
# Persisted volumes
# ------------------------------
volumes:
  kronicle-db-data: # Persistent data for TimescaleDB

# ------------------------------
# Shared network
# ------------------------------
networks:
  kronicle-net: # Custom network for container communication
