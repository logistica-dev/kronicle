[project]
name = "kronicle"
version = "0.7.0"
authors = [{ name = "Olivier Martineau", email = "olivier.martineau@irisa.fr" }]
maintainers = [
    { name = "Olivier Martineau", email = "olivier.martineau@irisa.fr" },
]
description = "FastAPI-powered TimescaleDB microservice for storing time-series measurements"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENCE.md"]
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
keywords = [
    "timeseries",
    "timescaledb",
    "storage",
    "fastapi",
    "digital twin",
    "Univ. Rennes",
    "IRISA",
]
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "pydantic-core>=2.50.1",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "rich>=15.0.0",
    "secure>=2.0.1",
    "sqlalchemy[postgresql]>=2.1.4",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "commitizen>=4.19.2",
    "flake8>=7.4.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "ruff>=0.17.0",
    "uv>=0.13.0",
    "uv-bump>=0.6.0",
]
test = [
    "kronicle-sdk>=0.4.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
]


[project.urls]
Homepage = "https://github.com/logistica-dev/kronicle"
Documentation = "https://github.com/logistica-dev/kronicle/blob/latest_branch/README.md"
Repository = "https://github.com/logistica-dev/kronicle"

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

# ----- Tool: black
[tool.black]
line-length = 120
target-version = ['py312']

# ----- Tool: commitizen
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["pyproject.toml:project.version"]

# ----- Tool: pytest
[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that require a running server",
]
pythonpath = ["", "src"]
norecursedirs = ["*.egg", ".eggs", "dist", "build", "wip"]
filterwarnings = ["ignore:.*pkg_resources.*:DeprecationWarning"]
addopts = [
    "--cov=kronicle",
    "--cov-report=term-missing",
    "--cov-report=html:reports/html_dir",
    "--cov-report=xml:reports/coverage.xml",
]
# ----- Tool: setuptools
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kronicle*"]

# ----- Tool: pyright
[tool.pyright]
exclude = ["**/__pycache__", "**/.env", "**/.vscod*"]
extraPaths = ["src", "../kronicle-sdk/src"]
include = ["src", "tests", "kronicle-sdk"]
pythonVersion = "3.12"
reportArgumentType = "warning"
reportDuplicateImport = true
reportImportCycles = true
reportIncompatibleMethodOverride = "warning"
reportMissingImports = true
reportUnusedImport = true
venv = ".venv"
venvPath = "."
verboseOutput = true

# ----- Tool: Ruff
[tool.ruff]
# match Black
line-length = 120
# auto-fix issues (imports, unused vars)
fix = true
# common codes: E/F=flake8, I=imports, B=bugs, C=complexity
# line length handled by Black
exclude = ["**/.venv", "**/__pycache__", "**/.env"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kronicle"]
known-third-party = ["asyncpg"]
