[project]
name = "kronicle"
version = "0.7.2"
authors = [{ name = "Olivier Martineau", email = "olivier.martineau@irisa.fr" }]
maintainers = [
    { name = "Olivier Martineau", email = "olivier.martineau@irisa.fr" },
]
description = "FastAPI-powered TimescaleDB microservice for storing time-series measurements"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENCE.md"]
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
keywords = [
    "timeseries",
    "timescaledb",
    "storage",
    "fastapi",
    "digital twin",
    "Univ. Rennes",
    "IRISA",
]
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.156.7",
    "pydantic>=2.14.1",
    "pydantic-core>=2.50.1",
    "pydantic-settings>=2.16.1",
    "python-jose>=3.5.0",
    "rich>=15.0.0",
    "secure>=2.0.1",
    "sqlalchemy[postgresql]>=2.1.5",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "commitizen>=4.19.2",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "ruff>=0.17.1",
    "uv>=0.13.4",
    "uv-bump>=0.6.0",
]
test = [
    "bandit>=1.9.4",
    "kronicle-sdk>=0.7.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
    "tox>=4.67.1",
    "tox-uv>=1.37.0",
]


[project.urls]
Homepage = "https://github.com/logistica-dev/kronicle"
Documentation = "https://github.com/logistica-dev/kronicle/blob/latest_branch/README.md"
Repository = "https://github.com/logistica-dev/kronicle"

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

# ----- Tool: black
[tool.black]
line-length = 120
target-version = ['py312']

# ----- Tool: commitizen
[tool.commitizen]
name = "cz_conventional_commits"
version_files = ["pyproject.toml:project.version"]
version_provider = "pep621"
pre_bump_hooks = ["scripts/commit/commitizen_pre_bump_hook.sh"]

# ----- Tool: coverage
[tool.coverage.run]
omit = ["src/kronicle/_build.py", "*/__init__.py"]

# ----- Tool: pytest
[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that require a running server",
]
pythonpath = ["", "src"]
norecursedirs = ["*.egg", ".eggs", "dist", "build", "wip"]
filterwarnings = ["ignore:.*pkg_resources.*:DeprecationWarning"]
addopts = [
    "--cov=kronicle",
    "--cov-report=term-missing",
    "--cov-report=html:reports/html_dir",
    "--cov-report=xml:reports/coverage.xml",
]
# ----- Tool: setuptools
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kronicle*"]

# ----- Tool: pyright
[tool.pyright]
exclude = ["**/__pycache__", "**/.env", "**/.vscod*"]
extraPaths = ["src", "../kronicle-sdk/src"]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
reportArgumentType = "warning"
reportDuplicateImport = true
reportImportCycles = true
reportIncompatibleMethodOverride = "warning"
reportMissingImports = true
reportUnusedImport = true
venv = ".venv"
venvPath = "."
verboseOutput = true

# ----- Tool: Ruff
[tool.ruff]
# match Black
line-length = 120
# auto-fix issues (imports, unused vars)
fix = true
# common codes: E/F=flake8, I=imports, B=bugs, C=complexity
# line length handled by Black
exclude = ["**/.venv", "**/__pycache__", "**/.env"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kronicle"]
known-third-party = ["asyncpg"]


# ----- Tool: tox
# Install:
#   uv tool install tox --with tox-uv
# Single source of truth for the checks run locally and in CI:
#   uv run tox                # all environments, serial
#   uv run tox run-parallel   # what CI runs (only py312 writes coverage)
#   uv run tox -e py312       # one environment
[tool.tox]
env_list = ["quality", "py311", "py312", "py313", "py314", "py315"]
skip_missing_interpreters = false

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
# The interpreter envs exist to prove the suite runs on each version, so only
# py312 (the dev interpreter, see [tool.tox.env.py312] below) instruments the
# run. Coverage is off everywhere else: it triples the test time, and measuring
# it under every version yields no extra information — the badge publishes a
# single percentage, and the line counts genuinely differ between versions
# (coverage.py's executable-line detection changed in 3.14), so comparing them
# compares different denominators.
commands = [["pytest", "-q", "-p", "no:cacheprovider", "--no-cov"]]

# The one env that produces the coverage reports the badge reads. It writes the
# shared reports/coverage.xml, which is safe precisely because no other env
# writes one — the interpreter envs run in parallel.
[tool.tox.env.py312]
commands = [["pytest", "-q", "-p", "no:cacheprovider"]]

[tool.tox.env.quality]
base_python = ["python3.12"]
dependency_groups = ["dev", "test"]
commands = [
    [
        "ruff",
        "check",
        "--no-fix",
    ],
    [
        "black",
        "--check",
        "--diff",
        ".",
    ],
    [
        "pyright",
    ],
    [
        "bandit",
        "-c",
        "pyproject.toml",
        "-r",
        "src",
    ],
]
