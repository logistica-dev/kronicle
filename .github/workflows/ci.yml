# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
    tags: ['0.*']
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------
  # 1. Unit tests — fast, no Docker
  # -------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest

  # -------------------------------------------------------
  # 2. Integration tests — DB + App via Docker Compose
  # -------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      KRONICLE_DB_NAME: ${{ secrets.KRONICLE_DB_NAME }}
      KRONICLE_CHAN_CREDS: ${{ secrets.KRONICLE_CHAN_CREDS }}
      KRONICLE_RBAC_CREDS: ${{ secrets.KRONICLE_RBAC_CREDS }}
      KRONICLE_SU_INFO: ${{ secrets.KRONICLE_SU_INFO }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Start DB + App
        run: docker compose -f docker-compose.ci.test.yml up -d --build

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for Kronicle app..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/ready > /dev/null 2>&1; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start within 120s"
          docker compose -f docker-compose.ci.test.yml logs app
          exit 1

      - name: Run integration tests
        env:
          KRONICLE_HOST: localhost
          KRONICLE_PORT: 8000
          KRONICLE_SU_NAME: ${{ secrets.KRONICLE_SU_NAME }}
          KRONICLE_SU_PASS: ${{ secrets.KRONICLE_SU_PASS }}
          KRONICLE_USR_NAME: ${{ secrets.KRONICLE_USR_NAME }}
          KRONICLE_USR_PASS: ${{ secrets.KRONICLE_USR_PASS }}
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -m integration

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.test.yml down -v

  # -------------------------------------------------------
  # 3. Build & push multi-arch Docker image to GHCR
  # -------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Kronicle
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          tags: |
            ghcr.io/${{ github.repository_owner }}/kronicle:latest
            ghcr.io/${{ github.repository_owner }}/kronicle:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kronicle:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/kronicle:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/kronicle:cache,mode=max
